<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HybridFormer3D (BAR-Net) Web Interface</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style_slider.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="figures/favicon.svg">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar - Left -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 8V16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <h2>MedVision AI</h2>
                    <span>Advanced Imaging System</span>
                </div>
            </div>

            <div class="sidebar-scrollable">
                <div class="sidebar-section">
                    <div class="section-header">
                        <img src="figures/hospital.svg" alt="Hospital" class="section-icon">
                        <h3>Hospital Details</h3>
                    </div>
                    <div class="form-group">
                        <label>Hospital Name</label>
                        <input type="text" value="Central Medical Center" readonly class="readonly-input">
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <select>
                            <option>Radiology & Imaging</option>
                            <option>Neurology</option>
                            <option>Oncology</option>
                        </select>
                    </div>
                </div>

                <div class="sidebar-section">
                    <div class="section-header">
                        <img src="figures/patient.svg" alt="Patient" class="section-icon">
                        <h3>Patient Information</h3>
                    </div>
                    <div class="form-group">
                        <label>Patient ID</label>
                        <input type="text" placeholder="PT-29001" value="PT-29001">
                    </div>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="John Doe" value="Nguyễn Văn A">
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select>
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" value="45">
                    </div>
                    <div class="form-group">
                        <label>Weight (kg)</label>
                        <input type="number" value="68">
                    </div>
                </div>

                <div class="sidebar-section">
                    <div class="section-header">
                        <img src="figures/scan.svg" alt="Scan" class="section-icon">
                        <h3>Study details</h3>
                    </div>
                    <div class="form-group">
                        <label>Modality</label>
                        <select>
                            <option>MRI</option>
                            <option>CT Scan</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" value="2026-09-21">
                    </div>
                </div>
            </div>

            <div class="sidebar-action">
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                <label for="imageInput" class="upload-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Load Scan Image
                </label>
                <div id="file-name" class="file-name">No file selected</div>
                
                <button id="predictBtn" class="primary-btn" disabled>
                    <span class="btn-text">Run BAR-Net Protocol</span>
                    <span class="loader hidden"></span>
                </button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace">
            <header class="workspace-header">
                <div class="header-title">
                    <h2>Diagnostic Viewer</h2>
                    <span class="status-badge">AI Ready</span>
                </div>
                <div class="user-info">
                    <div class="user-details">
                        <span class="name">Dr. Tran</span>
                        <span class="role">Chief Radiologist</span>
                    </div>
                    <div class="avatar">👨‍⚕️</div>
                </div>
            </header>

            <div id="errorBox" class="error-box hidden"></div>

            <div class="viewer-grid">
                <!-- Original Image Panel -->
                <div class="panel">
                    <div class="panel-header">
                        <h3>Original Scan</h3>
                        <span class="view-tag">Transverse</span>
                    </div>
                    <div class="panel-body">
                        <div class="image-container empty-state" id="originalContainer">
                            <div class="empty-content">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                                <span>Please load a scan image</span>
                            </div>
                            <img id="originalImg" src="" alt="" class="hidden" />
                        </div>
                    </div>
                </div>

                <!-- Segmentation Result Panel -->
                <div class="panel highlight-panel">
                    <div class="panel-header">
                        <h3>AI Segmentation</h3>
                        <div class="tools hidden" id="maskTools">
                            <label class="toggle-switch">
                                <input type="checkbox" id="overlayToggle">
                                <span class="slider"></span>
                                <span class="label-text">Overlay</span>
                            </label>
                            <div class="slider-container" id="opacityControlContainer">
                                <input type="range" id="opacitySlider" min="0" max="1" step="0.1" value="0.6">
                            </div>
                        </div>
                    </div>
                    <div class="panel-body">
                        <div class="image-container empty-state" id="resultContainer">
                            <div class="empty-content">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 16 16 12 12 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                                <span>Run segmentation to view</span>
                            </div>
                            <!-- The wrapper for blended view -->
                            <div id="blendWrapper" class="blend-wrapper hidden">
                                <img id="blendBase" src="" alt="" />
                                <img id="blendMask" src="" alt="" class="mask-layer" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Clinical Notes Panel -->
            <div class="notes-panel">
                <div class="notes-header">
                    <h3>Clinical Observations</h3>
                    <div class="notes-actions">
                        <button class="icon-btn" title="Print Report">🖨️</button>
                        <button class="secondary-btn">Save Report</button>
                    </div>
                </div>
                <textarea placeholder="Enter diagnostic notes here based on the segmentation results..."></textarea>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
